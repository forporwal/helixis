[project]
name = "helixis-engine"
version = "0.1.0"
description = "Helixis — a self-improving automation agent (recursive intelligence track)"
# The license text lives at the repo root, outside this package dir. A relative
# license-files entry resolves to a path-traversal entry in the wheel
# (dist-info/licenses/../../LICENSE), so we declare the SPDX expression only.
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "automation-bench>=1.0.5",
    # Pinned, not floored. verifiers 0.2.x changed the task-payload contract to
    # require JSON objects, which breaks AutomationBench's plain-string `task`
    # column with "Plain string task routes are no longer supported". A `>=`
    # floor silently resolves to 0.2.x and every rollout dies before its first
    # tool call. This is the version in AutomationBench's own uv.lock.
    "verifiers==0.1.12.dev2",
    "openai>=1.60",
    "datasets>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
realtier = [
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
helixis = "helixis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helixis"]

[tool.uv.sources]
# AutomationBench is not published to any index, so it is pinned to an upstream
# commit rather than vendored. uv.lock records the resolved rev; move it
# deliberately with `uv lock --upgrade-package automation-bench`.
automation-bench = { git = "https://github.com/zapier/AutomationBench", rev = "a321764ace3cfbe42289e6a13abef2f0f4f56fad" }
