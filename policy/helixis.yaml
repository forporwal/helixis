# Helixis mocked-tier policy — deny-by-default.
# Applied with: openshell policy set helixis --policy policy/helixis.yaml --wait
#
# `policy set` REPLACES the whole policy, so filesystem_policy / landlock /
# process must be present in every file we ship, not just the network stanzas.
#
# Every struct here is deny_unknown_fields: one stray key (including a
# `description:`) is a hard parse failure, not a warning.
#
# MODEL HOST PLACEHOLDER --------------------------------------------------
# `inference.local` below is a PLACEHOLDER. Helixis is provider-agnostic; swap
# the host (and the rule path, which differs per provider) to match whatever
# HELIXIS_AGENT_BASE_URL points at, then re-apply the policy:
#
#   Featherless : host api.featherless.ai   path /v1/chat/completions
#   Fireworks   : host api.fireworks.ai     path /inference/v1/chat/completions
#   local vLLM  : host inference.local      path /v1/chat/completions
#
#   HOST=api.fireworks.ai; PATHV=/inference/v1/chat/completions
#   sed -e "s|inference\.local|$HOST|" -e "s|/v1/chat/completions|$PATHV|" \
#       policy/helixis.yaml > /tmp/helixis.yaml
#   openshell policy set helixis --policy /tmp/helixis.yaml --wait
# -------------------------------------------------------------------------

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /app]
  read_write: [/sandbox, /tmp]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # The only sanctioned egress on the mocked tier. Scoped to the python binary
  # so a shell-out to curl/wget cannot ride the same allowance (Req 4.2).
  model_endpoint:
    name: model-endpoint
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        tls: true
        enforcement: enforce
        # `rules` and `access` are mutually exclusive on one endpoint; the
        # explicit method+path pair is tighter than any access preset.
        rules:
          - allow: { method: POST, path: /v1/chat/completions }
          - allow: { method: GET, path: /v1/models }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }
      - { path: /sandbox/.venv/bin/python3* }
      - { path: /sandbox/.uv/python/**/python3* }
