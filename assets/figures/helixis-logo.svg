<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120" width="96" height="120" role="img" aria-label="Helixis logo: a double helix">
  <defs>
    <linearGradient id="strandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#828fff"/>
      <stop offset="100%" stop-color="#5e6ad2"/>
    </linearGradient>
    <linearGradient id="strandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cc26a"/>
      <stop offset="100%" stop-color="#2f8f47"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-width="7">
    <!-- rungs: drawn at the points of maximum strand separation -->
    <g stroke="#34343a" stroke-width="4.5">
      <line x1="26" y1="41" x2="70" y2="41"/>
      <line x1="26" y1="78" x2="70" y2="78"/>
    </g>

    <!-- execute strand -->
    <path stroke="url(#strandA)"
          d="M24,6 C24,23 72,23 72,41 C72,59 24,59 24,78 C24,96 72,96 72,114"/>
    <!-- learn strand -->
    <path stroke="url(#strandB)"
          d="M72,6 C72,23 24,23 24,41 C24,59 72,59 72,78 C72,96 24,96 24,114"/>
  </g>

  <g fill="#f7f8f8">
    <circle cx="24" cy="6" r="4"/><circle cx="72" cy="6" r="4"/>
    <circle cx="72" cy="114" r="4"/><circle cx="24" cy="114" r="4"/>
  </g>
</svg>
